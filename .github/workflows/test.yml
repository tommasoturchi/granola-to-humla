name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Python the importer supports, and the newest.
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.x"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest -v test_granola_to_humla
      - name: Command-line entry point
        run: granola-to-humla --version
