[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "granola-to-humla"
dynamic = ["version"]
description = "Import a Granola CSV export into the Humla meeting-notes app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tommaso Turchi" }]
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3",
    "py3langid>=0.4",
    "rich>=13.7",
    "typer>=0.15.4",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/tommasoturchi/granola-to-humla"

[project.scripts]
granola-to-humla = "granola_to_humla:main"

[tool.setuptools]
py-modules = ["granola_to_humla"]

[tool.setuptools.dynamic]
version = { attr = "granola_to_humla.__version__" }
